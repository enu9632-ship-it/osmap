        .side-menu {

        .clock-text { font-family: 'Consolas', monospace; font-size: 26px; font-weight: bold; color: #f1c40f; }

        .weather-box { padding: 15px; background: #fff; border-bottom: 1px solid #eee; }
        .weather-title { font-weight: bold; font-size: 14px; margin-bottom: 8px; color: #333; }
        .weather-details { font-size: 16px; color: #111; font-weight: 500; }
        .weather-details b { color: #e74c3c; }

        .search-box { padding: 12px; background: #f8f9fa; border-bottom: 1px solid #ddd; display: flex; gap: 5px; }

        .search-box button { padding: 8px 12px; background: #e74c3c; color: white; border: none; border-radius: 4px; cursor: pointer; }

        .map-type-tabs { display: flex; background: #eee; }

        .map-type-tabs button.active { background: #fff; color: #e74c3c; border-bottom: 2px solid #e74c3c; }

        /* 수정된 부분: 하단 빈칸 제거를 위해 max-height와 padding 조정 */
        .filter-content { padding: 15px 15px 5px 15px; max-height: 60vh; overflow-y: auto; }
        .filter-group { margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .filter-group:last-child { border-bottom: none; margin-bottom: 0; }
        .filter-header { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: bold; }
        .facility-list { margin-top: 8px; display: none; max-height: 150px; overflow-y: auto; background: #fff; border: 1px solid #f0f0f0; }
        .list-item { padding: 6px 10px; font-size: 11px; border-bottom: 1px solid #f9f9f9; cursor: pointer; }

        .traffic-toggle { padding: 10px 15px; background: #fff; display: flex; align-items: center; justify-content: space-between; font-size: 13px; font-weight: bold; border-top: 1px solid #eee; }
        .manual-buttons { padding: 10px; display: flex; gap: 5px; background: #f1f2f6; }
        .manual-btn { flex: 1; padding: 10px 5px; font-size: 11px; border-radius: 4px; background: white; cursor: pointer; font-weight: bold; border: 1px solid #ddd; text-align: center; color: black; }
        
        .info-card { padding: 15px; font-size: 13px; width: 300px; min-height: 200px; line-height: 1.6; box-sizing: border-box; }
        .info-card .danger-tag { color: #e74c3c; font-weight: bold; font-size: 11px; margin-bottom: 4px; display: block; } 
        .info-card b.title { color: #2c3e50; font-size: 16px; display: block; border-bottom: 1.5px solid #e74c3c; margin-bottom: 10px; padding-bottom: 5px; }
        .accident-grid { display: grid; grid-template-columns: 65px 1fr; gap: 6px 8px; background: #fff5f5; padding: 10px; border-radius: 6px; border: 1px solid #ffdada; }
        .accident-label { font-weight: bold; color: #c0392b; white-space: nowrap; font-size: 12px; }
        .accident-value { color: #333; font-size: 12px; word-break: keep-all; }
        .facility-info { padding: 5px 0; border-bottom: 1px dashed #ddd; margin-bottom: 8px; }
        .rv-btn { display: block; margin-top: 15px; padding: 10px; background: #2c3e50; color: white; text-align: center; border-radius: 4px; text-decoration: none; font-weight: bold; cursor: pointer; font-size: 13px; border: none; width: 100%; }

        #manual-modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 85%; max-width: 550px; max-height: 80vh; background: white; z-index: 3000; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: none; padding: 25px; overflow-y: auto; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 2500; display: none; }
        .modal-header { font-size: 20px; font-weight: bold; margin-bottom: 15px; color: #e74c3c; border-bottom: 2px solid #f1f2f6; padding-bottom: 10px; }
        .modal-body { font-size: 13.5px; line-height: 1.7; color: #333; }

        .modal-close { margin-top: 20px; width: 100%; padding: 12px; background: #2c3e50; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }

        #roadview-container > * { direction: ltr; }
        #rv-close { position: absolute; top: 5px; right: 5px; z-index: 1001; background: #e74c3c; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>

    <script>
        const manuals = {
            fire: {
                title: "🔥 화재 발생 국민행동요령",
                body: `<h4>[화재대응 - 불이 났을 때]</h4>1. <b>주변 알림:</b> "불이야!" 소리치거나 비상벨을 눌러 알립니다.<br>2. <b>판단:</b> 작은 불이면 소화기로 끄고, 크면 즉시 대피합니다.<br>3. <b>대피:</b> 엘리베이터 금지! 계단을 이용해 지상이나 옥상으로 대피합니다.<br>4. <b>신고:</b> 안전한 곳에 도달한 후 119에 신고합니다.<h4>[완강기 사용법]</h4>1. 지지대 고리에 완강기 걸고 잠금 → 2. 릴(줄) 창밖 투척 → 3. 벨트 가슴 조임 → 4. 벽 짚으며 하강.<h4>[소화기 사용법]</h4>1. 안전핀 뽑기 → 2. 노즐을 불쪽으로 → 3. 손잡이 움켜쥐기 → 4. 빗자루 쓸듯 쏘기.<h4>[옷에 불이 붙었을 때]</h4>멈추기 → 얼굴 감싸기 → 바닥에 엎드리기 → 구르기.`

        function showManual(type) {
            document.getElementById('modalHeader').innerHTML = manuals[type].title;
            document.getElementById('modalBody').innerHTML = manuals[type].body;

        }

        function updateTime() {
            var now = new Date();
            var week = ['일','월','화','수','목','금','토'];
            document.getElementById('currentDate').innerText = `${now.getFullYear()}년 ${String(now.getMonth()+1).padStart(2,'0')}월 ${String(now.getDate()).padStart(2,'0')}일 (${week[now.getDay()]})`;
            document.getElementById('clock').innerText = now.toTimeString().split(' ')[0];
        }
        setInterval(updateTime, 1000); updateTime();

        function updateWeather() {
            const serviceKey = 'zfaegJHFil6FTDtaPh1/nSpouAPMlD006nb4pOwRhAxfAt1GV0vn1s9zEuPKXBUS6MEqUNH2z23NIZROAmgS8g==';
            const nx = 62; const ny = 118;
            const now = new Date();
            const baseDate = now.getFullYear() + String(now.getMonth() + 1).padStart(2, '0') + String(now.getDate()).padStart(2, '0');
            const hours = now.getHours();
            let baseTime = "0500";
            const times = [2, 5, 8, 11, 14, 17, 20, 23];
            for (let t of times) { if (hours >= t) baseTime = String(t).padStart(2, '0') + "00"; }
            const url = `https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0/getVilageFcst?serviceKey=${encodeURIComponent(serviceKey)}&numOfRows=10&pageNo=1&dataType=JSON&base_date=${baseDate}&base_time=${baseTime}&nx=${nx}&ny=${ny}`;
            fetch(url).then(res => res.json()).then(data => {
                const items = data.response.body.items.item;
                let tmp = "--", sky = "1", pty = "0";
                items.forEach(i => {
                    if(i.category === "TMP") tmp = i.fcstValue;
                    if(i.category === "SKY") sky = i.fcstValue;
                    if(i.category === "PTY") pty = i.fcstValue;
                });
                let status = "맑음";
                if(pty !== "0") {
                    if(pty === "1") status = "비 🌧️";
                    else if(pty === "2") status = "진눈깨비 🌨️";
                    else if(pty === "3") status = "눈 ❄️";
                } else {
                    if(sky === "1") status = "맑음 ☀️";
                    else if(sky === "3") status = "구름많음 ⛅";
                    else if(sky === "4") status = "흐림 ☁️";
                }
                document.getElementById('weatherTitle').innerHTML = `🌦️ 오산시 실시간 날씨 (${baseTime.substring(0,2)}시 기준)`;
                document.getElementById('weatherDisplay').innerHTML = `기온 : <b>${tmp}°C</b> / 하늘 : <b>${status}</b>`;
            }).catch(e => { document.getElementById('weatherDisplay').innerText = "업데이트 중..."; });
        }

var facilitiesData = [
